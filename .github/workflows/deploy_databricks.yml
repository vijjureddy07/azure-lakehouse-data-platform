# ==============================================================================
# GitHub Actions: Secure Databricks Bundle Deployment (CD) Workflow (Module 6)
# Product: Databricks Declarative Automation Bundles
# Authentication: GitHub Workload Identity Federation (OIDC) - Zero Stored Secrets
# ==============================================================================

name: Deploy Databricks Bundle

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target environment (dev, prod)"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - prod

# Ensure only one deployment runs at a time without cancelling in-flight deployments
concurrency:
  group: databricks-deployment-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.target == 'prod' && 'production' || 'development' }}

    permissions:
      id-token: write   # Required for GitHub OIDC token exchange
      contents: read    # Required to checkout repository code

    env:
      DATABRICKS_AUTH_TYPE: "github-oidc"
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python for Wheel Build
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Tooling
        run: |
          pip install build wheel

      # 3. Setup Official Databricks CLI
      - name: Setup Databricks CLI
        uses: databricks/setup-cli@v0.229.0

      # 4. Validate Declarative Automation Bundle
      - name: Validate Bundle
        run: |
          databricks bundle validate --target ${{ inputs.target }}

      # 5. Deploy Bundle to Databricks Workspace
      - name: Deploy Bundle
        run: |
          databricks bundle deploy --target ${{ inputs.target }}

      # 6. Display Deployment Resource Summary
      - name: Bundle Summary
        run: |
          databricks bundle summary --target ${{ inputs.target }}
