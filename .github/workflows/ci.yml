# ==============================================================================
# GitHub Actions: Continuous Integration (CI) Workflow (Module 6)
# ==============================================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate_and_test:
    name: Lint, Test & Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python Environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Setup Java for PySpark Local Execution
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 4. Install Dependencies
      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 5. Static Code Quality & Linting
      - name: Run Ruff Linter
        run: |
          ruff check .

      # 6. Automated Unit & Integration Tests (Modules 1–6)
      - name: Run Full Pytest Suite
        run: |
          pytest -v

      # 7. Build Python Release Wheel Artifact
      - name: Build Python Wheel
        run: |
          python -m build --wheel

      # 8. Smoke Test Wheel Installation & Imports in Clean Environment
      - name: Smoke Test Wheel Install & Imports
        run: |
          python -m venv /tmp/clean_env
          /tmp/clean_env/bin/pip install dist/*.whl
          /tmp/clean_env/bin/python -c "import src.orchestration.models; import src.modeling.dimensions; import src.medallion.silver; print('Wheel smoke test passed!')"
          rm -rf /tmp/clean_env
