# ==============================================================================
# Lakeflow Jobs Orchestration Specification (Module 5)
# Product: Azure Databricks Lakeflow Jobs (formerly Databricks Workflows / Jobs)
# Workload: Omnichannel Retail Medallion Lakehouse & Kimball Dimensional Warehouse
# ==============================================================================

resources:
  jobs:
    retail_lakehouse_batch_pipeline:
      name: "Retail Lakehouse Batch Pipeline"
      description: "End-to-end Lakeflow Job orchestrating ADF Landing Validation, Bronze Ingestion, Silver Conformance, If/Else Quality Threshold Evaluation, Gold Analytics, Dimensional Warehouse, Operational Quality Gates, and Delta Run Auditing."
      
      # ------------------------------------------------------------------------
      # Job-Level Parameters (Bundle Variable Defaults & Dynamic Runtime Values)
      # ------------------------------------------------------------------------
      parameters:
        - name: environment
          default: "${var.environment}"
        - name: ingestion_date
          default: "{{job.start_time.iso_date}}"
        - name: adf_run_id
          default: "manual_orchestration_run"
        - name: storage_account_name
          default: "${var.storage_account_name}"
        - name: container_name
          default: "${var.container_name}"
        - name: catalog_name
          default: "${var.catalog_name}"
        - name: quarantine_threshold_rate
          default: "${var.quarantine_threshold_rate}"
        - name: job_id
          default: "{{job.id}}"
        - name: job_run_id
          default: "{{job.run_id}}"
        - name: job_start_time
          default: "{{job.start_time.iso_datetime}}"

      # ------------------------------------------------------------------------
      # Health Duration Threshold (Alert if Run Exceeds Baseline)
      # ------------------------------------------------------------------------
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600

      # ------------------------------------------------------------------------
      # Task Dependency Graph (DAG)
      # ------------------------------------------------------------------------
      tasks:
        # Task 1: Validate ADF Landing Batch Availability
        - task_key: validate_landing_batch
          description: "Prerequisite check verifying that the ADF landing batch exists and contains all 8 required datasets."
          notebook_task:
            notebook_path: "databricks/tasks/validate_landing.py"
          timeout_seconds: 600
          max_retries: 0

        # Task 2: Bronze Layer Raw Delta Ingestion
        - task_key: bronze_ingestion
          description: "Ingests raw immutable landing files for the requested batch into Bronze Delta tables with metadata tracking."
          depends_on:
            - task_key: validate_landing_batch
          notebook_task:
            notebook_path: "databricks/tasks/run_bronze.py"
          timeout_seconds: 1200
          max_retries: 1
          min_retry_interval_millis: 15000

        # Task 3: Silver Conformance, Deduplication & Quality Quarantine
        - task_key: silver_transformation
          description: "Conforms Bronze into clean Silver Delta tables, routes defect records to quarantine, and verifies mathematical reconciliation."
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: "databricks/tasks/run_silver.py"
          timeout_seconds: 1800
          max_retries: 0

        # Task 4: Conditional If/Else Check on Quarantine Rate
        - task_key: check_quarantine_threshold
          description: "Evaluates whether the Silver quarantine rate exceeded the configured warning threshold."
          depends_on:
            - task_key: silver_transformation
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.silver_transformation.values.quarantine_alert_triggered}}"
            right: "true"

        # Task 5A: Quality Attention Branch (Executes when condition == true)
        - task_key: quality_attention
          description: "Logs non-fatal operational warnings when quarantine rate exceeds threshold without halting pipeline."
          depends_on:
            - task_key: check_quarantine_threshold
              outcome: "true"
          notebook_task:
            notebook_path: "databricks/tasks/quality_attention.py"
          timeout_seconds: 300

        # Task 5B: Gold Analytical KPIs (Parallel branch with Warehouse)
        - task_key: gold_analytics
          description: "Computes business analytical KPIs and aggregates for reporting dashboards."
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: "databricks/tasks/run_gold.py"
          timeout_seconds: 1200
          max_retries: 1
          min_retry_interval_millis: 15000

        # Task 5C: Kimball Dimensional Warehouse (Parallel branch with Gold)
        - task_key: dimensional_warehouse
          description: "Executes Kimball star schema modeling (dim_customer SCD2, dim_product SCD1, PIT fact_sales) and enterprise quality gates."
          depends_on:
            - task_key: silver_transformation
          notebook_task:
            notebook_path: "databricks/tasks/run_warehouse.py"
          timeout_seconds: 2400
          max_retries: 0

        # Task 6: Final Operational Quality Gate
        - task_key: final_quality_gate
          description: "Verifies high-level operational quality criteria and reconciliation results across all upstream layers."
          depends_on:
            - task_key: gold_analytics
            - task_key: dimensional_warehouse
          notebook_task:
            notebook_path: "databricks/tasks/final_quality_gate.py"
          timeout_seconds: 600
          max_retries: 0

        # Task 7: Publish Operational Run Summary (Runs on SUCCESS or FAILURE)
        - task_key: publish_run_summary
          description: "Compiles operational metrics and persists an audit row to delta/operations/job_run_audit under all conditions."
          depends_on:
            - task_key: final_quality_gate
          run_if: ALL_DONE
          notebook_task:
            notebook_path: "databricks/tasks/publish_run_summary.py"
          timeout_seconds: 300
          max_retries: 1

      # ------------------------------------------------------------------------
      # Schedule Configuration (Deployment-Ready, Paused by Default)
      # ------------------------------------------------------------------------
      schedule:
        quartz_cron_expression: "0 0 4 * * ?"  # 04:00 UTC Daily
        timezone_id: "UTC"
        pause_status: "PAUSED"
