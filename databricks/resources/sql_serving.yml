# ==============================================================================
# Declarative Automation Bundle: SQL Warehouse Resource (Module 6)
# Product: Databricks Serverless SQL Warehouse
# ==============================================================================

resources:
  sql_warehouses:
    retail_lakehouse_serving_warehouse:
      name: "${var.serving_warehouse_name}"
      cluster_size: "2X-Small"
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 10
      warehouse_type: "PRO"
      enable_serverless_compute: true
      channel:
        name: "CHANNEL_NAME_CURRENT"
