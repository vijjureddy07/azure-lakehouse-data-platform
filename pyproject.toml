[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-lakehouse-data-platform"
version = "0.1.0"
description = "Omnichannel Retail Azure Lakehouse Data Platform (Delta Medallion, Kimball Warehouse, Lakeflow Jobs, SQL Serving)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0,<3.6.0",
    "delta-spark>=3.2.0,<3.3.0",
    "pyarrow>=14.0.0",
    "Faker>=28.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "build>=1.0.0",
    "wheel>=0.40.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"databricks/notebooks/*" = ["F821", "E402"]
"databricks/tasks/*" = ["F821", "E402"]
